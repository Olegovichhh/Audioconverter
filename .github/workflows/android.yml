name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Bundle GeneralUser GS SoundFont
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2" -o app/src/main/assets/default.sf2
          test $(stat -c%s app/src/main/assets/default.sf2) -gt 30000000
      - name: Prepare FluidSynth native SDK
        run: |
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p app/src/main/jniLibs/$ABI
            curl -fL --retry 3 "https://raw.githubusercontent.com/kotlinds/fluidsynth-kmp/main/fluidsynth-kmp/src/androidMain/jniLibs/$ABI/libfluidsynth.so" -o app/src/main/jniLibs/$ABI/libfluidsynth.so
          done
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk